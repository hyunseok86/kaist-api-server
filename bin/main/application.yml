server:
  port: 8080

spring:
  application:
    name: api-server
  datasource:
    url: jdbc:mysql://localhost:3306/kaistblue?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: kaistblue
    password: blue1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    show-sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# springdoc v1 configuration (compatible with Spring Boot 2.7)
springdoc:
  swagger-ui:
    path: /swagger-ui

mybatis:
  mapper-locations: classpath:mybatis/mapper/*.xml
  type-aliases-package: com.kaist.api.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
    com.kaist.api.mapper: debug
    org.apache.ibatis: debug
